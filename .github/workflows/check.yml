name: Check

on:
  push:
  pull_request:

jobs:
  template:
    # The classifier template runs on 20 synthetic emails with mock adapters: envelope-only input, labels-only output,
    # the enabled switch, the keep_items cap, a DRY_RUN smoke of the CLI, and a negative control.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node template/check.mjs
      - name: model path for Claude, OpenAI, Gemini and OpenAI-compatible against a local mock
        run: node template/check-llm.mjs
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node eval/score.mjs --break
      - run: |
          if [ -f eval/llm-cache.json ]; then node eval/score.mjs; else echo "no eval/llm-cache.json yet — eval not run"; fi
  board:
    # The board is one static file: no external scripts, demo addresses only on the reserved .example TLD,
    # and the data-layer functions (cfg, configured, ghGet, ghPut and the mail/config reads and writes) keep their shape.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test "$(grep -c '<script src="http' index.html)" = 0
          test "$(grep -oiE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}' index.html | grep -vc '\.example')" = 0
          for f in "function cfg()" "function configured()" "async function ghGet(path,fresh)" "function ghPut(path,obj,sha,message)" "ghGet('mail/mail.json')" "ghGet('mail/config.json')" "ghPut('mail/config.json'" "localStorage.getItem('pha-lang')"; do grep -qF "$f" index.html || { echo "missing: $f"; exit 1; }; done
          echo "board checks passed"
  content-security-policy:
    # exactly script-src 'self' + the sha256 of each inline script, before the first script, and no inline handlers;
    # the self-test makes each way of removing, loosening or unpinning it go red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node check-csp.mjs
      - run: node check-csp.mjs --self-test
