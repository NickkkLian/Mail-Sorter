<script>/* ---- appearance.js (inlined; source: design system theme kit) ---- */
/* appearance.js — palette (Plaster · Paper · Ink) and light/dark for every Nick Lian product page.
   Contract with design-tokens.css (v3.1):
     <html>                                  Plaster, follows the OS light/dark setting
     <html data-theme="paper|ink">           another palette
     <html data-scheme="light|dark">         forced light or dark

   The choice is stored in localStorage (nl-theme, nl-scheme). The inline boot snippet at the top of <head> applies it
   before the first paint, so there is no flash; this file keeps everything in sync afterwards.

   Two controls, one writer (Appearance.set):
     Appearance.bindToggle(button)            the top-bar ◐: light/dark only, never the palette. Its name stays
                                              "Dark mode"; aria-pressed says whether dark is on.
     Appearance.bindSettings(button, opts)    the top-bar gear: opens the Settings dialog. `opts` (or a function
                                              returning it, read on every open) may carry `strings` (see STRINGS)
                                              and `sections` (extra nodes after Appearance, e.g. a connection form).
     Appearance.settings(opts)                the Theme and Appearance controls alone, for mounting elsewhere.
     Single-key shortcuts (products that have them pass `shortcuts`, a one-line description of their keys): an On | Off
     group after Appearance, stored as nl-shortcuts ("off" turns them off; anything else, or nothing, is on). Products
     read Appearance.shortcutsOn() before acting on a page-level single key (WCAG 2.1.4).
   No dependencies. Styles use design tokens only. */
(function (root) {
  'use strict';

  var THEMES = ['plaster', 'paper', 'ink'];
  var THEME_NAMES = { plaster: 'Plaster', paper: 'Paper', ink: 'Ink' };   // names, not translated
  var SCHEMES = ['system', 'light', 'dark'];
  var STRINGS = {
    en: { title: 'Settings', theme: 'Theme', appearance: 'Appearance', system: 'System', light: 'Light', dark: 'Dark',
          shortcuts: 'Single-key shortcuts', on: 'On', off: 'Off',
          caption: 'Saved in this browser only. Plaster and System are the defaults.', done: 'Done' },
    zh: { title: '设置', theme: '配色', appearance: '明暗', system: '跟随系统', light: '浅色', dark: '深色',
          shortcuts: '单键快捷键', on: '开', off: '关',
          caption: '只保存在这个浏览器里。Plaster 与「跟随系统」是默认值。', done: '完成' }
  };

  function get() {

    var sw = doc.querySelectorAll('.nl-swatch');

      '.nl-pick{position:relative;display:inline-flex;align-items:center;gap:var(--space-3);cursor:pointer;padding:var(--space-2) var(--space-3) var(--space-2) var(--space-2);',
      'border:1px solid var(--border);border-radius:var(--radius-md);background:var(--paper);color:var(--text);font-size:var(--text-sm);',
      'transition:border-color var(--dur-fast) var(--ease-out),background-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}',
      '.nl-pick:active{transform:scale(var(--press-scale))}',
      '.nl-pick input,.nl-seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0}',
      '.nl-pick:has(input:checked){border-color:var(--accent-text);background:var(--accent-tint);color:var(--accent-tint-text)}',
      '.nl-pick:has(input:focus-visible),.nl-seg label:has(input:focus-visible){outline:var(--border-focus-width) solid var(--focus);outline-offset:2px}',
      '.nl-swatch{display:grid;grid-template-columns:repeat(3,1fr);width:46px;height:26px;border-radius:var(--radius-xs);overflow:hidden;border:1px solid var(--border);flex:none}',
      '.nl-swatch i{display:block}',
      '.nl-swatch i:nth-child(1){background:var(--bg)}.nl-swatch i:nth-child(2){background:var(--band)}.nl-swatch i:nth-child(3){background:var(--point)}',
      '.nl-seg{display:inline-flex;width:fit-content;max-width:100%;justify-self:start;padding:2px;gap:2px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-2)}',
      '.nl-seg label{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:72px;height:28px;padding:0 var(--space-2);border-radius:var(--radius-sm);',
      'cursor:pointer;font-size:var(--text-xs);color:var(--text-2);transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}',
      // the selected segment needs a ring: paper on the sunken track alone is 1.03-1.25:1; the ring is 3.29-4.19:1
      '.nl-seg label:has(input:checked){background:var(--paper);color:var(--text);font-weight:var(--weight-medium);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--border-input)}',
      '.nl-caption{margin:0;font-family:var(--font-display);font-style:var(--caption-style);font-weight:400;font-variation-settings:"opsz" var(--opsz-caption);',
      'font-size:var(--text-sm);line-height:var(--leading-relaxed);color:var(--text-2);max-width:var(--measure)}',
      '.nl-note{margin:0;font-size:var(--text-xs);line-height:var(--leading-normal);color:var(--text-2);max-width:var(--measure)}',
      '@media (pointer:coarse){.nl-seg label{height:var(--touch-min)}.nl-pick{min-height:var(--touch-min)}.nl-dialog .nl-done{min-height:var(--touch-min);min-width:var(--touch-min)}}',
      '@media (prefers-reduced-motion:reduce){.nl-pick:active,.nl-dialog .nl-done:active{transform:none;background:var(--neutral-tint)}}',
      '.nl-dialog{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface-raised);color:var(--text);box-shadow:var(--shadow-2);',
      'padding:var(--space-5);width:min(460px,calc(100vw - 2 * var(--gutter,16px)));max-width:100%;max-height:calc(100dvh - 2 * var(--gutter,16px));overflow:auto;overscroll-behavior:contain}',
      '.nl-dialog::backdrop{background:var(--overlay)}',
      '.nl-dialog h2{margin:0 0 var(--space-5);font:var(--display-weight,600) var(--text-lg)/var(--leading-tight) var(--font-display);font-variation-settings:"opsz" var(--opsz-title)}',
      '.nl-dialog .nl-section{margin-top:var(--space-6);padding-top:var(--space-5);border-top:1px solid var(--hairline)}',
      '.nl-dialog .nl-acts{display:flex;justify-content:flex-end;margin-top:var(--space-6)}',
      // Done commits nothing, so it is the neutral button, not the filled primary
      '.nl-dialog .nl-done{min-height:var(--control-h);padding:0 var(--space-4);border-radius:var(--radius-sm);border:1px solid var(--border-input);background:var(--paper);color:var(--text);',
      'font:inherit;font-size:var(--text-sm);font-weight:var(--weight-medium);cursor:pointer;transition:background-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}',
      '.nl-dialog .nl-done:active{transform:scale(var(--press-scale))}',
      '.nl-dialog .nl-done:focus-visible{outline:var(--border-focus-width) solid var(--focus);outline-offset:2px}',
      '@media (hover:hover) and (pointer:fine){.nl-pick:hover{border-color:var(--border-strong)}.nl-seg label:hover{color:var(--text)}.nl-dialog .nl-done:hover{background:var(--surface-hover)}}'
    ].join('');
    var st = doc.createElement('style'); st.setAttribute('data-nl-appearance', ''); st.textContent = css; doc.head.appendChild(st);
  }

  function el(tag, attrs, kids) {
    var n = doc.createElement(tag), k;
    for (k in attrs || {}) if (Object.prototype.hasOwnProperty.call(attrs, k)) n.setAttribute(k, attrs[k]);
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? doc.createTextNode(c) : c); });
    return n;
  }

    var input = el('input', { type: 'radio', name: name, value: value, 'data-nl': kind });
    input.checked = checked;
    input.addEventListener('change', function () { if (!input.checked) return; if (kind === 'shortcuts') { setShortcuts(value === 'on'); return; } var n = {}; n[kind] = value; set(n); });
    return input;
  }

<script>
/* safe-merge v1 — source of truth: the safe-merge library, kept outside this app. This block, from this comment to the

/* ============ GitHub Contents API (same paths, same fields; a save whose sha is out of date is merged by SafeMerge) ============ */
// fresh: skip the browser cache (a save re-reading the file must see what is there now, not a copy up to 60 s old)
async function ghGet(path,fresh){return HubSettingsRuntime.track(async()=>{/* settings workflow */
  const c=cfg();
  const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`,
    {headers:{Authorization:`Bearer ${c.token}`,Accept:'application/vnd.github+json'},...(fresh?{cache:'no-store'}:{})});
  HubSettingsRuntime.fileRead(c,path,r.status);
  if(r.status===404) return {data:null,sha:null};
  if(r.status===401||r.status===403) throw Object.assign(new Error('GitHub '+r.status),{kind:'auth',reason:T('GitHub 拒绝了这个令牌（'+r.status+'）','GitHub refused the token ('+r.status+')'),fix:T('粘贴一个对这个仓库有 Contents 读写权限的新令牌。','Paste a new fine-grained token with Contents read and write on this repo.')});
  if(!r.ok) throw Object.assign(new Error('GitHub '+r.status),{kind:'http',reason:T('GitHub 返回 '+r.status,'GitHub answered '+r.status),fix:T('过一分钟再试。','Try again in a minute.')});
  const j=await r.json();let content=j.content;
  if(j.encoding!=='base64'&&j.sha&&j.size>0){
    const br=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/git/blobs/${j.sha}`,{headers:{Authorization:`Bearer ${c.token}`,Accept:'application/vnd.github+json'},cache:'no-store'});
    if(!br.ok)throw Error('Private state blob unavailable');content=(await br.json()).content;
  }
  try{ if(typeof content!=='string'||(!content&&j.size!==0))throw Error('Empty state');return {data:JSON.parse(b64decode(content)),sha:j.sha}; }
  catch{ throw {kind:'data',reason:T(path+' 不是有效的 JSON',path+' is not valid JSON'),fix:T('刷新重试；未改动任何文件。','Refresh and retry; no file was changed.')}; }
});}
// One PUT; returns the Response. A 409 used to be retried here with the same body, which wrote this tab's copy of
// config.json over whatever had been changed since it loaded (found 2026-09-23). SafeMerge.save now handles it.
function ghPut(path,obj,sha,message){
  const c=cfg();
  const body={message,content:b64encode(JSON.stringify(obj,null,2))};
  if(sha) body.sha=sha;
  return fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`,
    {method:'PUT',headers:{Authorization:`Bearer ${c.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
}
// Save config.json: a stale save re-reads the file and merges three ways (base = as this page last read or saved it);
// only a value changed on both sides asks. One save at a time, so two clicks never race on one sha.
let retryConfig=null;
const configQueue=SafeMerge.serial(async (message,key,revision)=>{return HubSettingsRuntime.track(async()=>{/* settings workflow */
  if(key!==appSave.key())throw new HubSettingsContract.SettingsError('conflict');
  const token=appSave.start(key,revision);
  try{
  const sent=SafeMerge.snapshot(CONF);
  const r=await SafeMerge.save({data:sent,sha:SHA_CONF,base:BASE_CONF,T,
    put:(d,sha)=>ghPut('mail/config.json',d,sha,message),
    get:async()=>{return HubSettingsRuntime.track(async()=>{/* settings workflow */ const g=await ghGet('mail/config.json',true); return {json:g.data,sha:g.sha}; });}});
  SHA_CONF=r.sha; BASE_CONF=SafeMerge.snapshot(r.data);
  // merged: the page takes the merged file plus anything changed here meanwhile (otherwise the next save would treat
  // what came from elsewhere as deleted here)
  if(r.merged){ CONF=SafeMerge.rebase(sent,r.data,CONF); render(); }
  appSave.succeed(token,r.wrote===false?null:new Date());
  return r;
  }catch(error){appSave.fail(token,error);throw error;}
});});
function saveConf(message){
  const key=appSave.key(),revision=appSave.pending(key,()=>{CONF=SafeMerge.formChanges(BASE_CONF,retryConfig,CONF);return saveConf(message);});
  retryConfig=SafeMerge.snapshot(CONF);return configQueue(message,key,revision);
}

/* Category names come from YOUR config.json, so they are whatever you typed — often Chinese.
   The key is the stable identifier (the model classifies into keys, not labels), so the board
   can show an English name for the keys the template ships without touching your data.
   Order: your own `label_en` if you added one → the shipped English name for that key →
   your label verbatim. A category we do not know still shows exactly what you wrote. */
/* Category names come out of mail/config.json in your own private repo — the Gmail labels the classifier creates,
   read back — so a board wired to a mailbox kept in another language shows that language. English mode looks in
   three places, in order, and shows what your config says if it finds none:
     1. label_en, if you wrote one — your words beat anything here;
     2. CAT_EN, by key: the keys this project's classifier creates, plus the template's. A key is an identifier and
        reads the same in every language, which is why the table is keyed on it rather than on the label;
     3. the label as it is — a category you add later keeps its own words rather than going blank.
   A mailbox sorted by an older generation of the classifier can carry keys this table does not know. The answer for
   that is label_en in your own config: it is yours to write, and it does not put your label names in a public file. */
const CAT_ZH={people:'往来',finance:'钱款',official:'正式文件',travel:'出行',security:'账号',school:'学业',job:'求职',health:'健康',other:'未分组'};
const CAT_EN={
  action:'To do', job:'Jobs', school:'School', security:'Accounts', newsletter:'Newsletters',
  people:'People', official:'Official', health:'Health', work:'Work', finance:'Money', life:'Life', travel:'Travel', logistics:'Shipping',
  account:'Accounts', promo:'Promotions', reading:'Reading', other:'Unsorted'};
function catLabel(key){
  const cats=(CONF&&CONF.categories)||[]; const c=cats.find(x=>x.key===key);
  const label=c?c.label:key;
  if(lang==='en') return (c&&c.label_en)||CAT_EN[key]||label;
  return (c&&c.label_zh)||(!c||label===CAT_EN[key]?CAT_ZH[key]||label:label);
}
/* The reason under each row is not the mail and not the interface: it is a clause the classifier wrote into your
   digest, in whatever language its prompt asked for. English mode shows reason_en when the classifier wrote one; for
   rows written before it did, it shows the stored reason only if there is no CJK in it, and otherwise shows no reason
   at all — the category still says what the row is, so nothing goes blank. Chinese mode shows what was stored. */
const CJK=/[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af\uf900-\ufaff]/;
function reasonFor(i){
  if(lang==='zh'&&i.reason_zh)return i.reason_zh;
  if(lang==='zh'){
    const labels={'Keep signal':'值得保留的邮件','Unsorted':'暂时无法判断文件夹','Model unavailable; left in place':'模型暂时不可用，已保留','Model not configured; left in place':'还没设置模型，已保留','Invalid model output; left in place':'模型结果不符合要求，已保留','Body unavailable; left in place':'暂时无法读取正文，已保留'};
    if(labels[i.reason])return labels[i.reason];
    const rule=String(i.reason||'').match(/^Cleanup rule (O[1-7])$/);
    if(rule)return '符合「'+({'O1':'一次性验证码','O2':'物流通知','O3':'已结束活动','O4':'商家推广','O5':'订阅简报','O6':'社交和应用通知','O7':'普通登录提醒'}[rule[1]])+'」的清理规则';
  }
  if(lang==='en') return i.reason_en || (i.reason && !CJK.test(i.reason) ? i.reason : '');
  return i.reason || i.reason_en || '';
}
/* A mail client puts its own reply/forward marker in front of the subject, in the language of that client's
   interface ("转发:", "回复:"). The marker is not part of what the sender wrote, so English mode shows it as Fwd:/Re:;
   the rest of the subject is the email's own text and is left exactly as it is. Display only: the digest, the search
   and the Gmail link all keep using the stored subject. A chain such as "Re: 转发: …" is read marker by marker. */
const SUBJ_MARKS=[[/^(?:转发|轉發|转寄|轉寄)\s*[:：]\s*/,'Fwd: '],[/^(?:回复|回覆|答复|答覆)\s*[:：]\s*/,'Re: '],
  [/^(?:re|fwd?|aw|wg|sv|tr|rv)\s*[:：]\s*/i,null]];
function subjectFor(subj){
  if(lang!=='en'||!subj) return subj;
  let out='', rest=String(subj);
  for(let guard=0; guard<8; guard++){
    const hit=SUBJ_MARKS.map(([rx,to])=>[rest.match(rx),to]).find(([m])=>m);
    if(!hit) break;
    out+=hit[1]===null?hit[0][0]:hit[1]; rest=rest.slice(hit[0][0].length);
  }
  return out+rest;
}

function focusKey(el){
  if(!el||el===document.body||el===document.documentElement) return null;
  const scope=el.parentElement&&el.parentElement.closest('[id]'), within=scope?'#'+CSS.escape(scope.id)+' ':'', tag=el.tagName.toLowerCase();

  const tries=['id','data-id','data-key','data-sort','href','name'].filter(a=>el.getAttribute(a)).map(a=>within+tag+'['+a+'='+quote(el.getAttribute(a))+']');
  const kind=tag+(typeof el.className==='string'&&el.className.trim()?'.'+el.className.trim().split(/\s+/).map(c=>CSS.escape(c)).join('.'):'');
  // a control inside a record (data-id) is looked for in that record first, then in the record now at its place, then nowhere
  const rec=el.parentElement&&el.parentElement.closest('[data-id]'), recs=rec?within+rec.tagName.toLowerCase()+'[data-id]':null;

    if(rec){ const r=document.querySelector(within+rec.tagName.toLowerCase()+'[data-id='+quote(recId)+']')||document.querySelectorAll(recs)[recAt]; return r?r.querySelectorAll(kind)[inRec]||null:null; }
    return index<0?null:document.querySelectorAll(within+kind)[index]||null; };

document.querySelector('.skip').addEventListener('click',e=>{ e.preventDefault(); firstHeading().focus(); });   // no #main in the address
async function localDemoWrite(path,write){
  const key=appSave.key(path),revision=appSave.pending(key,()=>localDemoWrite(path,write)),token=appSave.start(key,revision);
  try{const result=await write();appSave.succeed(token);document.dispatchEvent(new Event("headersort-data"));return result;}catch(error){appSave.fail(token,error);throw error;}
}
globalThis.HeadersortBoard={
  demo:DEMO, available:()=>DEMO||Boolean(CONF&&configured()&&!LOAD_ERROR),
  getConfig:()=>CONF,
  getMail:()=>MAIL,
  localWrite:localDemoWrite,
  viewState:()=>({filter,query,mailboxFilter}),
  setFilter,clearFilters,catLabel,reasonFor,subjectFor,senderName,senderAddress,
  setShownItems:items=>{shownDealtItems=items;},
  showSettings:()=>SuiteSettings.open('app'),
  reload:loadAll,
  loading:()=>REFRESHING||Boolean(configured()&&!LOADED&&!DEMO),
  get:(path,fresh)=>ghGet(path,fresh),
  put:async(path,data,sha,message)=>{const key=appSave.key(path),revision=appSave.pending(key,async()=>{const fresh=await ghGet(path,true);if(!SafeMerge.same(fresh.data,data)&&fresh.sha!==sha)throw new HubSettingsContract.SettingsError('conflict');return HeadersortBoard.put(path,data,fresh.sha,message);});const token=appSave.start(key,revision);try{return await HubSettingsRuntime.track(async()=>{const r=await ghPut(path,data,sha,message);if(!r.ok)throw Error('HTTP '+r.status);const result=await r.json();appSave.succeed(token);document.dispatchEvent(new Event("headersort-data"));return result;});}catch(error){appSave.fail(token,error);throw error;}},
  isDirty:()=>mailCleanupDirty,markDirty:value=>{mailCleanupDirty=Boolean(value);appSave.draft('cleanup-form',mailCleanupDirty);},
  saveConfig:async(value,baseline=CONF)=>HubSettingsRuntime.track(async()=>{if(DEMO)return localDemoWrite('mail/config.json',()=>{CONF=value;render();});return HubSettingsRuntime.track(async()=>{/* settings workflow */const before=CONF;CONF=SafeMerge.formChanges(baseline,value,CONF);try{await saveConf("mail: update cleanup settings");}catch{CONF=SafeMerge.rebase(value,before,CONF);throw Error("Save unavailable");}});}),
  subscribe:fn=>document.addEventListener("headersort-data",fn),
  shownItems:()=>shownDealtItems,
  language:()=>lang
};
applyStatic();
loadAll();
</script>

<script src="assets/settings-standard/panel.js"></script>
